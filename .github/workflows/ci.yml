# CI: PR과 main push에서 백엔드 test · build, 프론트 lint · test · build (docs DEVELOPMENT 7장 「CI (개발 저장소)」).
# job 이름 `backend`는 main 브랜치 보호의 필수 status check 이름과 같아야 한다.
# DB가 필요한 테스트는 내장 DB 대신 MySQL 8.4 서비스 컨테이너로 돌린다 (compose.yaml과 같은 버전).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        # CI 컨테이너 안에서만 쓰는 임시 값. 실제 비밀 값이 아니다.
        env:
          MYSQL_DATABASE: keepsy
          MYSQL_USER: keepsy
          MYSQL_PASSWORD: keepsy-ci
          MYSQL_ROOT_PASSWORD: keepsy-ci-root
          TZ: Asia/Seoul
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ukeepsy -pkeepsy-ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    # 테스트 설정(src/test/resources/config/application.yaml)이 읽는 테스트 DB 값. 위 서비스 컨테이너를 가리킨다 (Keepsy #330).
    env:
      MYSQL_TEST_HOST: 127.0.0.1
      MYSQL_TEST_PORT: 3306
      MYSQL_TEST_DATABASE: keepsy
      MYSQL_TEST_USER: keepsy
      MYSQL_TEST_PASSWORD: keepsy-ci
      # 사진 저장소 (F16). CI에서만 쓰는 임시 값이다.
      APP_STORAGE_DIR: build/ci-photos
      APP_STORAGE_SIGNING_KEY: keepsy-ci-only-signing-key-not-a-secret

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: ./gradlew build

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # 단위 테스트 (node --test). 통과 · 실패 수가 로그 끝에 나온다
      - run: npm test
      - run: npm run build
