# 테스트 전용 설정 (Keepsy #330). 테스트 클래스패스에만 있고, src/main/resources/application.yaml보다 우선한다.
# 일부 테스트가 모든 매장의 발송 대기(deliverPending) · 접근 로그(purgeExpired)를 바꾸므로 개발 DB(.env)에 붙지 않게
# DB 이름 · 계정을 테스트 전용 값으로 고정한다. Gradle · IntelliJ(JUnit) 어느 쪽으로 돌려도 같다.
# - 로컬: `docker compose --profile test up -d mysql-test` (127.0.0.1:3307, compose.yaml)
# - CI: 워크플로가 MYSQL_TEST_* 환경 변수로 서비스 컨테이너를 가리킨다
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_TEST_HOST:127.0.0.1}:${MYSQL_TEST_PORT:3307}/${MYSQL_TEST_DATABASE:keepsy_test}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    # compose mysql-test · CI 컨테이너 안에서만 쓰는 임시 값이다 (실제 비밀 값이 아님)
    username: ${MYSQL_TEST_USER:keepsy_test}
    password: ${MYSQL_TEST_PASSWORD:keepsy-test}

# 테스트가 올리는 사진은 개발 사진 디렉터리(.env의 APP_STORAGE_DIR)가 아니라 build 아래에 둔다
APP_STORAGE_DIR: ${APP_STORAGE_TEST_DIR:build/test-photos}
APP_STORAGE_SIGNING_KEY: keepsy-local-test-signing-key-not-a-secret
