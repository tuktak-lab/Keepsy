spring:
  application:
    name: backend
  config:
    import: optional:file:../.env[.properties]
  # 받은 시각을 Asia/Seoul로 맞춘다 (NFR-12, CONTRACTS 3장). 응답 시각은 TimeConfig.offset()으로 +09:00을 붙인다
  jackson:
    time-zone: Asia/Seoul
  # 페이지 요청 ?page=0&size=20 (0부터, CONTRACTS 3장, C13)
  data:
    web:
      pageable:
        default-page-size: 20
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
