plugins {
    id 'java'
    id 'org.springframework.boot' version '4.2.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.11.0'
}

group = 'com.tuktaklab'
version = '0.0.1-SNAPSHOT'
description = 'backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.flywaydb:flyway-mysql'
    // CSV 고객 일괄 등록 (FR-CUS-13, 결정 F50): 따옴표 · 줄바꿈 처리를 직접 짜지 않는다. Boot가 버전을 관리하지 않아 직접 적는다
    implementation 'org.apache.commons:commons-csv:1.14.1'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'seed'
    }
}

// C17 시드 생성 (Keepsy #335). 데모 전용 DB(compose mysql-demo, 이름이 _demo로 끝남)에만 적재한다. 기본 test · bootRun에서는 돌지 않는다.
// 예: ./gradlew seedDemo -Pseed.scale=perf -Pseed.random=42 -Pseed.until=2026-12-11 [-Pseed.recreate=true]
tasks.register('seedDemo', Test) {
    description = 'C17 시드 데이터를 데모 DB에 적재한다 (seed.scale=small|demo|perf)'
    group = 'application'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'seed'
    }
    systemProperty 'keepsy.seed.target', 'demo'
    systemProperties providers.gradlePropertiesPrefixedBy('seed.').get()
    testLogging {
        showStandardStreams = true
    }
    outputs.upToDateWhen { false }
}

// 결정체크리스트 F18: google-java-format AOSP 스타일(4칸). spotlessCheck는 check에 포함되어 ./gradlew build에서 돈다.
// 커밋 전 ./gradlew spotlessApply
spotless {
    java {
        target 'src/*/java/**/*.java'
        // Spotless 8.11.0은 google-java-format 2.x API에 맞춰져 있다 (1.x를 지정하면 포매터 호출이 실패함)
        googleJavaFormat('2.0.0').aosp()
    }
}
